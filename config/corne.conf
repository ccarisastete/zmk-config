# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y

# ==========================================
# ZMK - Pantallas nice!view e-paper
# ==========================================

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# ==========================================
# PANTALLA IZQUIERDA (CENTRAL)
# ==========================================

# Luna - animacion al escribir
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n

# Estado de Bluetooth
CONFIG_NICE_OLED_WIDGET_PROFILE_BIG=n

# Mostrar bateria de ambos lados
CONFIG_NICE_OLED_WIDGET_CENTRAL_SHOW_BATTERY_PERIPHERAL_AND_CENTRAL=y

# ==========================================
# PANTALLA DERECHA (PERIFERICA)
# ==========================================

# Activar animaciones
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y

# Seleccionar Pokemon
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_HEAD=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=y

# Mantener indicador de bateria
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SMART_BATTERY=y

#/* Nombre BLE */
CONFIG_ZMK_KEYBOARD_NAME="El Bigote"

#/* Entrar en idle después de 15 minutos */
CONFIG_ZMK_IDLE_TIMEOUT=900000

#/* Deep sleep después de 15 minutos */
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000